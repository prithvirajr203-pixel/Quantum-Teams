name: Deploy n8n Workflows to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Quantum-Teams
            git pull origin main

            cd /home/ubuntu/n8n

            for file in /home/ubuntu/Quantum-Teams/*.json; do
              echo "Importing: $file"
              docker cp "$file" n8n-n8n-1:/tmp/workflow.json
              docker compose exec -T n8n n8n import:workflow --input=/tmp/workflow.json
            done

            docker compose restart n8n
            echo "Deployment complete"
