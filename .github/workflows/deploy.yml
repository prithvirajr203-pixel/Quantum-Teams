name: Deploy n8n + Python Agent to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Quantum-Teams
            git pull origin main

            echo "=============================="
            echo "Deploying Python API 1 (port 5000)..."
            cd "/home/ubuntu/Quantum-Teams/n8n+ python"
            pip3 install flask requests pillow --break-system-packages
            sudo systemctl restart imagegen
            sleep 2
            sudo systemctl status imagegen --no-pager

            echo "=============================="
            echo "Deploying Python API 2 (port 5001)..."
            cd "/home/ubuntu/Quantum-Teams/n8n+ python 1"
            pip3 install -r requirements.txt --break-system-packages
            sudo systemctl restart imagegen2
            sleep 2
            sudo systemctl status imagegen2 --no-pager
            echo "=============================="

            echo "Deploying n8n workflows..."
            cd /home/ubuntu/Quantum-Teams

            N8N_URL="https://13.221.4.159.nip.io"
            API_KEY="${{ secrets.N8N_API_KEY }}"

            for file in "Auto -Telegram + Instagram.json" "xenhra.json" "xexnaro.json"; do
              full_path="/home/ubuntu/Quantum-Teams/$file"
              if [ ! -f "$full_path" ]; then
                echo "Skipping $file - not found"
                continue
              fi

              WF_NAME=$(jq -r '.name' "$full_path")
              echo "------------------------------"
              echo "Processing workflow: $WF_NAME ($file)"

              EXISTING_ID=$(curl -s "$N8N_URL/api/v1/workflows" -H "X-N8N-API-KEY: $API_KEY" | jq -r --arg name "$WF_NAME" '.data[] | select(.name==$name) | .id' | head -1)
              echo "Existing ID found: $EXISTING_ID"

              CLEAN_JSON=$(jq '{name, nodes, connections, settings: {executionOrder: "v1"}}' "$full_path")

              if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
                curl -s -X POST "$N8N_URL/api/v1/workflows/$EXISTING_ID/deactivate" -H "X-N8N-API-KEY: $API_KEY" > /dev/null
                UPDATE_RESPONSE=$(curl -s -X PUT "$N8N_URL/api/v1/workflows/$EXISTING_ID" -H "X-N8N-API-KEY: $API_KEY" -H "Content-Type: application/json" -d "$CLEAN_JSON")
                echo "Update Response: $UPDATE_RESPONSE"
                WORKFLOW_ID=$EXISTING_ID
              else
                RESPONSE=$(curl -s -X POST "$N8N_URL/api/v1/workflows" -H "X-N8N-API-KEY: $API_KEY" -H "Content-Type: application/json" -d "$CLEAN_JSON")
                echo "Create Response: $RESPONSE"
                WORKFLOW_ID=$(echo "$RESPONSE" | jq -r '.id')
              fi

              if [ "$WORKFLOW_ID" != "null" ] && [ -n "$WORKFLOW_ID" ]; then
                curl -s -X POST "$N8N_URL/api/v1/workflows/$WORKFLOW_ID/activate" -H "X-N8N-API-KEY: $API_KEY" > /dev/null
                echo "Activated: $WORKFLOW_ID"
              fi
            done

            echo "=============================="
            echo "Deployment complete - both python services + all workflows"
