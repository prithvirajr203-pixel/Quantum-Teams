name: Deploy n8n Workflows to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Quantum-Teams
            git pull origin main
            N8N_URL="https://13.221.4.159.nip.io"
            API_KEY="${{ secrets.N8N_API_KEY }}"
            for file in /home/ubuntu/Quantum-Teams/*.json; do
              WF_NAME=$(jq -r '.name' "$file")
              echo "=============================="
              echo "Processing workflow: $WF_NAME"
              echo "File: $file"
              EXISTING_ID=$(curl -s "$N8N_URL/api/v1/workflows" -H "X-N8N-API-KEY: $API_KEY" | jq -r --arg name "$WF_NAME" '.data[] | select(.name==$name) | .id' | head -1)
              echo "Existing ID found: $EXISTING_ID"
              CLEAN_JSON=$(jq '{name, nodes, connections, settings}' "$file")
              if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
                echo "Deactivating before update: $EXISTING_ID"
                DEACT_RESPONSE=$(curl -s -X POST "$N8N_URL/api/v1/workflows/$EXISTING_ID/deactivate" -H "X-N8N-API-KEY: $API_KEY")
                echo "Deactivate Response: $DEACT_RESPONSE"
                echo "Updating existing workflow ID: $EXISTING_ID"
                UPDATE_RESPONSE=$(curl -s -X PUT "$N8N_URL/api/v1/workflows/$EXISTING_ID" -H "X-N8N-API-KEY: $API_KEY" -H "Content-Type: application/json" -d "$CLEAN_JSON")
                echo "Update Response: $UPDATE_RESPONSE"
                WORKFLOW_ID=$EXISTING_ID
              else
                echo "Creating new workflow"
                RESPONSE=$(curl -s -X POST "$N8N_URL/api/v1/workflows" -H "X-N8N-API-KEY: $API_KEY" -H "Content-Type: application/json" -d "$CLEAN_JSON")
                echo "Create Response: $RESPONSE"
                WORKFLOW_ID=$(echo "$RESPONSE" | jq -r '.id')
              fi
              echo "Final Workflow ID: $WORKFLOW_ID"
              if [ "$WORKFLOW_ID" != "null" ] && [ -n "$WORKFLOW_ID" ]; then
                echo "Activating workflow ID: $WORKFLOW_ID"
                ACT_RESPONSE=$(curl -s -X POST "$N8N_URL/api/v1/workflows/$WORKFLOW_ID/activate" -H "X-N8N-API-KEY: $API_KEY")
                echo "Activate Response: $ACT_RESPONSE"
              else
                echo "Skipping activation - invalid workflow ID"
              fi
              echo "=============================="
            done
            echo "Deployment complete"
